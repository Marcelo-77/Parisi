<!DOCTYPE html>

<html lang="en">

<head>
    <script src="screen-display-boot.js?v=20261123flash1"></script>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Double-Y Warehouse System - New Company</title>

  <link rel="stylesheet" href="styles.css">

  <link rel="stylesheet" href="warehouse-styles.css">

  <link rel="stylesheet" href="pesquisa-styles.css">
  <link rel="stylesheet" href="company-styles.css">
  <link rel="stylesheet" href="screen-display.css?v=20261123wh1">

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

</head>

<body>

  <script src="auth-check.js"></script>

  <script src="header-menu.js"></script>

  <script src="menu-access.js?v=20261123wh1"></script>

  <script src="dev-environment-badge.js"></script>

  <div class="container">

    <header class="header">

      <div class="header-stats-row" style="display:none"></div>

      <div class="header-content">

        <h1><i class="fas fa-warehouse"></i> Double-Y Warehouse System</h1>

        <p class="header-search-users-label" id="companyPageTitle">New Company</p>

        <div class="header-actions" id="standardHeaderMenuMount"></div>

      </div>

    </header>



    <main class="main-content">

      <div class="form-container" style="width:100%;max-width:760px;">

        <div class="filters-container">

          <div class="filters-header user-form-header">

            <div class="company-form-header-main">

              <div id="companyHeaderLogoWrap" class="brand-image-wrap brand-image--header" hidden aria-hidden="true">

                <img id="companyHeaderLogoImg" class="brand-image-img" src="" alt="" hidden>

                <div id="companyHeaderLogoInitials" class="brand-image-initials" hidden></div>

              </div>

              <div class="company-form-header-text">

                <h2 id="companyFormTitle"><i class="fas fa-plus"></i> New Company</h2>

                <p id="companyFormSubtitle">Register company details and upload a logo.</p>

              </div>

            </div>

          </div>

          <div class="filters-content show">

            <form id="companyForm">

              <div class="form-row">

                <div class="form-group full-width">

                  <label for="companyName"><i class="fas fa-industry"></i> Company Name *</label>

                  <input type="text" id="companyName" name="companyName" maxlength="150" required placeholder="Enter company name">

                  <span class="error-message" id="companyName-error"></span>

                </div>

              </div>



              <div class="form-row">

                <div class="form-group full-width">

                  <label for="companyLogo"><i class="fas fa-image"></i> Company Logo</label>

                  <input type="file" id="companyLogo" name="companyLogo" accept="image/*">

                  <div id="companyLogoPreview" class="company-logo-file-preview">

                    <img id="companyLogoPreviewImg" src="" alt="Company logo preview">

                  </div>

                  <span class="error-message" id="companyLogo-error"></span>

                </div>

              </div>



              <div class="form-row">

                <div class="form-group full-width">

                  <label for="responsibleName"><i class="fas fa-user-tie"></i> Company Responsible</label>

                  <input type="text" id="responsibleName" name="responsibleName" maxlength="100" placeholder="Enter responsible person name">

                  <span class="error-message" id="responsibleName-error"></span>

                </div>

              </div>



              <div class="form-row">

                <div class="form-group">

                  <label for="companyEmail"><i class="fas fa-envelope"></i> Email</label>

                  <input type="email" id="companyEmail" name="companyEmail" maxlength="255" placeholder="company@email.com">

                  <span class="error-message" id="companyEmail-error"></span>

                </div>

                <div class="form-group">

                  <label for="companyPhone"><i class="fas fa-phone"></i> Phone</label>

                  <input type="tel" id="companyPhone" name="companyPhone" maxlength="20" placeholder="04 1234 5678">

                  <span class="error-message" id="companyPhone-error"></span>

                </div>

              </div>



              <div class="form-row">

                <div class="form-group full-width">

                  <label for="companyAddress"><i class="fas fa-map-marker-alt"></i> Address</label>

                  <input type="text" id="companyAddress" name="companyAddress" maxlength="255" placeholder="Street, city, state, postcode">

                  <span class="error-message" id="companyAddress-error"></span>

                </div>

              </div>



              <div class="form-actions" style="margin-top:20px;">

                <button type="submit" class="btn btn-primary" id="saveCompanyBtn"><i class="fas fa-save"></i> Save Company</button>

                <a href="search-company.html" class="btn btn-secondary"><i class="fas fa-search"></i> Search Companies</a>

              </div>

            </form>

          </div>

        </div>

      </div>

    </main>



    <footer class="footer">

      <p>&copy; 2026 Double-Y IT Systems. All rights reserved.</p>

    </footer>

  </div>



  <script src="brand-image.js"></script>

  <script src="new-company-script.js"></script>

</body>

</html>
