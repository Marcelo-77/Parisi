<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double-Y Warehouse System - Access</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="login-styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div id="loginEnvironmentStrip" class="login-environment-strip" role="status" hidden></div>

            <div class="double-y-wordmark double-y-wordmark--login login-wordmark" aria-label="Double Y"><img src="doubley-glyph.png" alt="" class="double-y-glyph" aria-hidden="true"><span class="double-y-name">Double Y</span><img src="doubley-glyph-bottom.png" alt="" class="double-y-glyph double-y-glyph-bottom" aria-hidden="true"></div>
            <h1><i class="fas fa-lock"></i> System Access</h1>
            <p id="loginSubtitle" class="login-subtitle">Enter your information to sign in.</p>

            <div id="loginEnvironmentWarning" class="login-environment-warning" role="note" hidden>
                <i class="fas fa-info-circle" aria-hidden="true"></i>
                <span id="loginEnvironmentWarningText"></span>
            </div>

            <form id="loginForm" class="login-form" autocomplete="off">
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email / User</label>
                    <input
                        type="text"
                        id="email"
                        name="email"
                        placeholder="Enter your email or root"
                        required
                        autofocus
                        autocomplete="username"
                        inputmode="email"
                    >
                </div>
                <div class="form-group">
                    <label for="password"><i class="fas fa-key"></i> Password</label>
                    <div class="login-password-wrap">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                            autocomplete="current-password"
                        >
                        <button
                            type="button"
                            class="login-password-toggle"
                            id="togglePasswordBtn"
                            aria-label="Show password"
                            aria-pressed="false"
                            title="Show password"
                        >
                            <i class="fas fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <div id="captchaPanel" class="login-captcha-panel" hidden>
                    <div class="login-captcha-title">
                        <i class="fas fa-robot"></i>
                        Verify you are not a robot
                    </div>
                    <p id="captchaQuestion" class="login-captcha-question">Solve the challenge below.</p>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="captchaAnswer"><i class="fas fa-shield-halved"></i> Answer</label>
                        <div class="login-captcha-row">
                            <input
                                type="text"
                                id="captchaAnswer"
                                name="captchaAnswer"
                                inputmode="numeric"
                                autocomplete="off"
                                placeholder="Type the result"
                            >
                            <button type="button" class="btn btn-secondary" id="refreshCaptchaBtn" title="New challenge">
                                <i class="fas fa-sync-alt"></i>
                            </button>
                        </div>
                    </div>
                    <input type="hidden" id="captchaId" value="">
                </div>

                <div id="loginError" class="login-error" role="alert" hidden>
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="loginErrorText">Invalid email or password.</span>
                </div>
                <button type="submit" class="btn btn-primary login-btn" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>
        </div>
        <p class="login-footer">&copy; 2026 Double-Y IT Systems. All rights reserved.</p>
        <p id="loginHostMeta" class="login-host-meta" hidden></p>
        <p id="loginVersionMeta" class="login-version-meta" hidden></p>
    </div>
    <script src="system-settings-shared.js"></script>
    <script src="system-settings-apply.js"></script>
    <script src="double-y-logo-effect.js"></script>
    <script src="dev-environment-badge.js"></script>
    <script src="login-script.js"></script>
</body>
</html>
