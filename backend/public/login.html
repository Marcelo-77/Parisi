<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101d35">
    <title>Login | Double-Y Warehouse System</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="login-styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="login-body">
    <div class="login-page">
        <div class="login-shell">
            <div class="login-card">
                <div id="loginEnvironmentStrip" class="login-environment-strip" role="status" hidden></div>

                <div class="double-y-wordmark double-y-wordmark--login login-wordmark" aria-label="Double Y">
                    <img src="doubley-glyph.png" alt="" class="double-y-glyph" aria-hidden="true">
                    <span class="double-y-name">Double Y</span>
                    <img src="doubley-glyph-bottom.png" alt="" class="double-y-glyph double-y-glyph-bottom" aria-hidden="true">
                </div>
                <h1 id="login-title">Welcome back</h1>
                <p id="loginSubtitle" class="login-subtitle">Sign in to access your account</p>

                <div id="loginEnvironmentWarning" class="login-environment-warning" role="note" hidden>
                    <i class="fas fa-info-circle" aria-hidden="true"></i>
                    <span id="loginEnvironmentWarningText"></span>
                </div>

                <form id="loginForm" class="login-form" autocomplete="off" novalidate>
                    <div class="form-group">
                        <label for="email">Username or Email</label>
                        <input
                            type="text"
                            id="email"
                            name="email"
                            placeholder="Enter your username or email"
                            required
                            autofocus
                            autocomplete="username"
                            inputmode="email"
                        >
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="login-password-wrap">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                required
                                autocomplete="current-password"
                                spellcheck="false"
                            >
                            <button
                                type="button"
                                class="login-password-toggle"
                                id="togglePasswordBtn"
                                aria-label="Show password"
                                aria-pressed="false"
                                title="Show password"
                            >Show</button>
                        </div>
                    </div>

                    <div class="login-options">
                        <label class="login-remember">
                            <input type="checkbox" id="rememberMe" name="rememberMe">
                            Remember me
                        </label>
                        <a href="#" class="login-forgot" id="forgotPasswordLink">Forgot password?</a>
                    </div>

                    <div id="captchaPanel" class="login-captcha-panel" hidden>
                        <div class="login-captcha-title">
                            <i class="fas fa-robot"></i>
                            Verify you are not a robot
                        </div>
                        <p id="captchaQuestion" class="login-captcha-question">Solve the challenge below.</p>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label for="captchaAnswer">Answer</label>
                            <div class="login-captcha-row">
                                <input
                                    type="text"
                                    id="captchaAnswer"
                                    name="captchaAnswer"
                                    inputmode="numeric"
                                    autocomplete="off"
                                    placeholder="Type the result"
                                >
                                <button type="button" class="btn btn-secondary" id="refreshCaptchaBtn" title="New challenge">
                                    <i class="fas fa-sync-alt"></i>
                                </button>
                            </div>
                        </div>
                        <input type="hidden" id="captchaId" value="">
                    </div>

                    <div id="loginInfo" class="login-info" role="status" hidden>
                        <i class="fas fa-check-circle"></i>
                        <span id="loginInfoText"></span>
                    </div>

                    <div id="loginError" class="login-error" role="alert" hidden>
                        <i class="fas fa-exclamation-circle"></i>
                        <span id="loginErrorText">Invalid email or password.</span>
                    </div>
                    <button type="submit" class="btn btn-primary login-btn" id="loginBtn">Sign In</button>
                </form>

                <div class="login-card-footer">
                    The link to your business's success in IT solutions.<br>
                    <span class="login-card-tagline">&copy; <span id="loginYear">2026</span> Double Y IT System</span>
                </div>
            </div>
        </div>
        <p id="loginHostMeta" class="login-host-meta" hidden></p>
        <p id="loginVersionMeta" class="login-version-meta" hidden></p>
    </div>
    <script src="system-settings-shared.js"></script>
    <script src="system-settings-apply.js"></script>
    <script src="double-y-logo-effect.js"></script>
    <script src="dev-environment-badge.js"></script>
    <script src="login-script.js?v=20261124ssdlogin1"></script>
</body>
</html>
